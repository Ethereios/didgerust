[package]
name = "cadsd"
version = "0.1.0"
edition = "2021"

[dependencies]
cadsd-accurate = { path = "rust-cadsd-accurate", default-features = true }
# GUI dependencies (optional, enabled via gui-bevy feature)
bevy = { version = "0.19", optional = true }
bevy_egui = { version = "0.41", optional = true }
egui_plot = { version = "0.36", optional = true }
rfd = { version = "0.17", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nalgebra = { version = "0.32", features = ["serde-serialize"] }
num-complex = "0.4"
rand = "0.8"
rand_distr = "0.4"
rayon = "1.10"
thiserror = "1.0"
env_logger = "0.11"
log = "0.4"
plotters = "0.3"
lazy_static = "1.4"
# Audio processing
cpal = { version = "0.18", optional = true }
# Research tools
autodiff-rs = { git = "https://github.com/ArunBabu98/autodiff-rs", optional = true }
dfdx = { version = "0.13", optional = true }

[dev-dependencies]
approx = "0.5"
ndarray = "0.16"
criterion = "0.5"

[features]
default = []
gui-bevy = ["bevy", "bevy_egui", "egui_plot", "rfd"]
cpal-integration = ["cpal"]
nn-integration = ["dfdx"]
diff-tlm = ["autodiff-rs"]
fdtd-validator = []
md-lif = []

[[bench]]
name = "waveguide_vs_tlm"
harness = false
