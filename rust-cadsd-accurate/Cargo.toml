[package]
name = "cadsd-accurate"
version = "0.1.0"
edition = "2021"
authors = ["CADSD Development Team"]
description = "Computer-Aided Didgeridoo Sound Design - Advanced acoustic modeling and optimization for didgeridoos and wind instruments"
homepage = "https://github.com/didgeridoo/cadsd"
repository = "https://github.com/didgeridoo/cadsd"
license = "CC-BY-NC-SA-4.0"
categories = ["science", "simulation", "multimedia::audio", "visualization"]
keywords = ["didgeridoo", "acoustics", "simulation", "optimization", "wind-instruments"]

[dependencies]
# Core numerical computing
nalgebra = "0.32"
num-complex = "0.4"
# Array operations
ndarray = { version = "0.15", features = ["serde"] }
# Parallel processing
rayon = "1.7"
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Error handling
thiserror = "1.0"
# Random number generation
rand = "0.8"
rand_distr = "0.4"
# Logging
log = "0.4"
env_logger = "0.9"
# Mathematical approximations
approx = "0.5"

# Optional dependencies for advanced features
plotters = { version = "0.3", optional = false }
clap = { version = "4.0", features = ["derive"], optional = false }
# GUI dependencies - using compatible versions
bevy = { version = "0.19", features = ["default"], optional = true }
bevy_egui = { version = "0.41", optional = true }
egui_plot = { version = "0.36", optional = true }
rfd = { version = "0.17", optional = true }
makepad-widgets = { path = "../../makepad/widgets", optional = true }
makepad-xr = { path = "../../makepad/xr", optional = true }
makepad-render = { path = "../../makepad/libs/render", optional = true }

[features]
default = ["visualization", "cli"]
visualization = []
cli = []
gui = ["makepad-widgets", "makepad-xr", "makepad-render"]
gui-bevy = ["bevy", "bevy_egui", "egui_plot"]
gui-gpui = []