[package]
name = "cadsd"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "Rust implementation of Computer-Aided Didgeridoo Sound Design (CADSD)"
license = "CC-BY-NC-SA-4.0"

[[bin]]
name = "cadsd"
path = "src/main.rs"

[[bin]]
name = "didgerust"
path = "src/bin/didgerust.rs"

[dependencies]
nalgebra = "0.30"
ndarray = { version = "0.15", features = ["serde"] }
rayon = "1.5"
num-complex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.9"
approx = "0.5"
rand = "0.8"
rand_distr = "0.4"

cadsd-accurate = { path = "rust-cadsd-accurate", features = ["gui-bevy"] }

[dev-dependencies]
# criterion = "0.5"