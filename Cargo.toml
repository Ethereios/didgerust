[package]
name = "cadsd"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.14", optional = true }
bevy_egui = { version = "0.28", optional = true }
egui_plot = { version = "0.28", optional = true }
rfd = { version = "0.14", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
nalgebra = { version = "0.32", features = ["serde-serialize"] }
num-complex = "0.4"
rand = "0.8"
rand_distr = "0.4"
rayon = "1.10"
thiserror = "1.0"
env_logger = "0.11"
log = "0.4"
plotters = "0.3"

[dev-dependencies]
approx = "0.5"
ndarray = "0.16"

[features]
default = []
gui-bevy = ["bevy", "bevy_egui", "egui_plot", "rfd"]

[[bin]]
name = "cadsd"
path = "src/main.rs"

[[bin]]
name = "cadsd-gui"
path = "src/bin/gui.rs"
required-features = ["gui-bevy"]